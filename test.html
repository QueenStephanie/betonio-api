<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Method Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
    }

    pre {
      background: #f4f4f4;
      padding: 10px;
      border-radius: 5px;
      overflow: auto;
    }
  </style>
</head>

<body>
  <h1>API Method Test</h1>
  <button onclick="testMethod()">Test Method Detection</button>
  <button onclick="testLogin()">Test Login Endpoint</button>
  <pre id="output">Output will appear here...</pre>

  <script>
    async function testMethod() {
      document.getElementById('output').textContent = 'Testing...';
      try {
        console.log('Sending POST to method_test.php...');
        const response = await fetch('http://localhost/betonio-api/method_test.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ test: 'data' })
        });
        console.log('Response status:', response.status);
        const data = await response.json();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        document.getElementById('output').textContent = 'Error: ' + error.message;
        console.error('Error:', error);
      }
    }

    async function testLogin() {
      document.getElementById('output').textContent = 'Testing login...';
      try {
        console.log('Sending POST to login.php...');
        const response = await fetch('http://localhost/betonio-api/login.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            email: 'test@school.edu',
            password: 'password123'
          })
        });
        console.log('Response status:', response.status);
        const data = await response.json();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        document.getElementById('output').textContent = 'Error: ' + error.message;
        console.error('Error:', error);
      }
    }
  </script>
</body>

</html>
